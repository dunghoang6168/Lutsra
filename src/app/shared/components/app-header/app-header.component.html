
    <header class="app-header">
      <div class="titlebar-content">
        <div class="header-left">
          <div #menuRoot class="app-menu-root">
            <button
              type="button"
              class="header-button menu-trigger"
              [class.active]="menuOpen()"
              [attr.aria-expanded]="menuOpen()"
              aria-haspopup="menu"
              aria-label="Open application menu"
              (click)="toggleMenu()">
              <app-icon name="more-horizontal" [size]="21" />
            </button>
            @if (menuOpen()) {
              <div class="app-menu" role="menu" aria-label="Application menu">
                <button type="button" role="menuitem" [disabled]="actionsDisabled()" (click)="addMusicFolder()">
                  <app-icon name="folder" [size]="17" />
                  <span>Add Music Folder…</span>
                </button>
                <button type="button" role="menuitem" [disabled]="actionsDisabled()" (click)="rescanLibrary()">
                  <app-icon name="refresh-cw" [size]="17" />
                  <span>Rescan Library</span>
                </button>
                @if (menuError()) {
                  <p class="menu-error" role="alert">{{ menuError() }}</p>
                }
                <footer>
                  <strong>Lutsra</strong>
                  <span>{{ isDesktop ? 'Desktop mode' : 'Browser demo mode' }}</span>
                </footer>
              </div>
            }
          </div>

          <div class="navigation-buttons" aria-label="Navigation history">
            <button type="button" class="header-button" [disabled]="!history.canGoBack()" (click)="history.back()" aria-label="Go back" title="Back">
              <app-icon name="chevron-left" [size]="20" />
            </button>
            <button type="button" class="header-button" [disabled]="!history.canGoForward()" (click)="history.forward()" aria-label="Go forward" title="Forward">
              <app-icon name="chevron-right" [size]="20" />
            </button>
            <a routerLink="/home" routerLinkActive="active" class="header-button home-button" aria-label="Home" title="Home">
              <app-icon name="home" [size]="18" />
            </a>
          </div>
        </div>

        <app-global-search />

        <div class="header-right">
          @if (scanProgress().isScanning || scanProgress().error) {
            <div
              class="runtime-status"
              [class.scanning]="scanProgress().isScanning"
              [class.error]="!!scanProgress().error"
              role="status"
              [title]="statusTitle()">
              <app-icon [name]="scanProgress().isScanning ? 'refresh-cw' : 'alert-triangle'" [size]="14" />
              <span class="status-label">{{ statusLabel() }}</span>
            </div>
          }
          <a routerLink="/settings" routerLinkActive="active" class="header-button settings-button" aria-label="Settings" title="Settings">
            <app-icon name="settings" [size]="18" />
          </a>
        </div>
      </div>
    </header>
