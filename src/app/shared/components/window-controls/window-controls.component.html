@if (enabled) {
  <div class="window-controls" role="group" aria-label="Window controls">
    <button type="button" class="window-control minimize" aria-label="Minimize window" title="Minimize" (click)="minimize()">
      <span class="control-dot">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8" /></svg>
      </span>
    </button>
    <button #maximizeButton type="button" class="window-control maximize" [class.native-hover]="snapHovered()"
      [attr.aria-label]="isMaximized() ? 'Restore window' : 'Maximize window'"
      (click)="toggleMaximize()">
      <span class="control-dot">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          @if (isMaximized()) {
            <path d="M5 6V4h7v7h-2M4 6h6v6H4z" />
          } @else {
            <rect x="4" y="4" width="8" height="8" rx="0.5" />
          }
        </svg>
      </span>
    </button>
    <button type="button" class="window-control close" aria-label="Close window" title="Close" (click)="close()">
      <span class="control-dot">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5 11.5 11.5M11.5 4.5l-7 7" /></svg>
      </span>
    </button>
  </div>
}
