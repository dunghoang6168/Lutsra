<div class="volume-control" [class.open]="expanded()" [class.adjusting]="adjusting()">
  <button
    type="button"
    class="volume-button"
    (click)="toggle()"
    [attr.aria-expanded]="expanded()"
    aria-controls="now-playing-volume-slider"
    aria-label="Adjust volume"
    title="Adjust volume">
    <app-icon [name]="player.isMuted() || player.volume() === 0 ? 'volume-x' : 'volume-2'" [size]="18" />
  </button>
  <div class="volume-reveal" [class.open]="expanded()">
    <div class="volume-range">
      <app-range-slider
        inputId="now-playing-volume-slider"
        [min]="0"
        [max]="100"
        [step]="1"
        [value]="volumePercent()"
        [disabled]="!expanded()"
        [muted]="player.isMuted()"
        [responsiveVertical]="true"
        ariaLabel="Volume"
        [ariaValueText]="volumeLabel()"
        (valueChange)="player.setVolume($event / 100)"
        (adjustingChange)="adjusting.set($event)" />
    </div>
    <span class="volume-tooltip" aria-hidden="true">{{ volumeLabel() }}</span>
  </div>
</div>
